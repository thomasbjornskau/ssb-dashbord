ze="17" x="1514" y="308">Svaret må være godt før du</text><text fill="#1E3A3F" font-family="Open Sans,Segoe UI,Arial,Arial" font-weight="400" font-size="17" x="1514" y="332">går videre. Det tar sjelden</text><text fill="#1E3A3F" font-family="Open Sans,Segoe UI,Arial,Arial" font-weight="400" font-size="17" x="1514" y="356">mer enn ett møte.</text><circle cx="1485" cy="399" r="16" stroke="#FFFFFF" stroke-width="2.5" fill="#274246"/><text fill="#FFFFFF" font-family="Open Sans,Segoe UI,Arial,Arial" font-weight="700" font-size="17" text-anchor="middle" x="1485" y="405">2</text><text fill="#1E3A3F" font-family="Open Sans,Segoe UI,Arial,Arial" font-weight="700" font-size="20" x="1514" y="406">Et nei er også et svar</text><text fill="#1E3A3F" font-family="Open Sans,Segoe UI,Arial,Arial" font-weight="400" font-size="17" x="1514" y="434">Det leder til en bedre løsning,</text><text fill="#1E3A3F" font-family="Open Sans,Segoe UI,Arial,Arial" font-weight="400" font-size="17" x="1514" y="458">ikke til et dårligere</text><text fill="#1E3A3F" font-family="Open Sans,Segoe UI,Arial,Arial" font-weight="400" font-size="17" x="1514" y="482">dashbord.</text><circle cx="1485" cy="525" r="16" stroke="#FFFFFF" stroke-width="2.5" fill="#274246"/><text fill="#FFFFFF" font-family="Open Sans,Segoe UI,Arial,Arial" font-weight="700" font-size="17" text-anchor="middle" x="1485" y="531">3</text><text fill="#1E3A3F" font-family="Open Sans,Segoe UI,Arial,Arial" font-weight="700" font-size="20" x="1514" y="532">De to siste avgjør levetiden</text><text fill="#1E3A3F" font-family="Open Sans,Segoe UI,Arial,Arial" font-weight="400" font-size="17" x="1514" y="560">Data og eierskap avgjør om</text><text fill="#1E3A3F" font-family="Open Sans,Segoe UI,Arial,Arial" font-weight="400" font-size="17" x="1514" y="584">dashbordet fortsatt virker</text><text fill="#1E3A3F" font-family="Open Sans,Segoe UI,Arial,Arial" font-weight="400" font-size="17" x="1514" y="608">et år etter lansering.</text><line x1="60" y1="104