e UI,Arial,Arial" font-weight="700" font-size="20" x="1514" y="406">Luft</text><text fill="#1E3A3F" font-family="Open Sans,Segoe UI,Arial,Arial" font-weight="400" font-size="17" x="1514" y="434">Avstand mellom kortene og luft</text><text fill="#1E3A3F" font-family="Open Sans,Segoe UI,Arial,Arial" font-weight="400" font-size="17" x="1514" y="458">inne i dem gjør mer for</text><text fill="#1E3A3F" font-family="Open Sans,Segoe UI,Arial,Arial" font-weight="400" font-size="17" x="1514" y="482">lesbarheten enn noen farge.</text><circle cx="1485" cy="525" r="16" stroke="#FFFFFF" stroke-width="2.5" fill="#274246"/><text fill="#FFFFFF" font-family="Open Sans,Segoe UI,Arial,Arial" font-weight="700" font-size="17" text-anchor="middle" x="1485" y="531">3</text><text fill="#1E3A3F" font-family="Open Sans,Segoe UI,Arial,Arial" font-weight="700" font-size="20" x="1514" y="532">Leseretning</text><text fill="#1E3A3F" font-family="Open Sans,Segoe UI,Arial,Arial" font-weight="400" font-size="17" x="1514" y="560">Det viktigste øverst til venstre.</text><text fill="#1E3A3F" font-family="Open Sans,Segoe UI,Arial,Arial" font-weight="400" font-size="17" x="1514" y="584">Blikket går så mot høyre og</text><text fill="#1E3A3F" font-family="Open Sans,Segoe UI,Arial,Arial" font-weight="400" font-size="17" x="1514" y="608">nedover, fra A til E.</text><circle cx="1485" cy="651" r="16" stroke="#FFFFFF" stroke-width="2.5" fill="#274246"/><text fill="#FFFFFF" font-family="Open Sans,Segoe UI,Arial,Arial" font-weight="700" font-size="17" text-anchor="middle" x="1485" y="657">4</text><text fill="#1E3A3F" font-family="Open Sans,Segoe UI,Arial,Arial" font-weight="700" font-size="20" x="1514" y="658">Konsistens</text><text fill="#1E3A3F" font-family="Open Sans,Segoe UI,Arial,Arial" font-weight="400" font-size="17" x="1514" y="686">Like ting har lik størrelse,</text><text fill="#1E3A3F" font-family="Open Sans,Segoe UI,Arial,Arial" font-weight="400" font-size="17" x="1514" y="710">plassering og stil. Da brukes</text><text fill="#1E3A3F" font-family="Open Sans,Segoe UI,Arial,Arial" font-weight="400" font-size="17" x="1514" y="734">blikket på tolkning.</text><rect x="60" y="1030" rx="3" width="30" height="20" stroke="#C9D0D1" stroke-width="1.5" fill="#C9D0D1"/><text fill="#5E787A" font-family="Open Sans,Segoe UI,Arial,Arial" font-weight="400" font-size="16" x="100" y="1046">Luft mellom kortene</text><rect x="285.93" y="1030" rx="4" width="30" height="20" stroke="#274246" stroke-width="2" fill="none"/><text fill="#5E787A" font-family="Open Sans,Segoe UI,Arial,Arial" font-weight="400" font-size="16" x="325.93" y="1046">Fremhevet eksempel</text><circle cx="560" cy="1040" r="12" stroke="#1E3A3F" stroke-width="2" fill="#FFFFFF"/><text fill="#1E3A3F" font-family="Open Sans,Segoe UI,Arial,Arial" font-weight="700" font-size="13" text-anchor="middle" x="560" y="1045">A</text><text fill="#5E787A" font-family="Open Sans,Segoe UI,Arial,Arial" font-weight="400" font-size="16" x="582" y="1046">Leserekkefølge</text><text fill="#5E787A" font-family="Open Sans,Segoe UI,Arial,Arial" font-weight="400" font-size="15" text-anchor="end" x="1860" y="1046">Oktober 2026 · Utkast · Grunnfigur: A1 · Fiktive tall</text></svg>